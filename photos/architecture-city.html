  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* font-family: Arial, Helvetica, sans-serif; */
      background: #fff;
      /* color: #222; */
      /* font-size: 13px; */
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: black;
      text-decoration: none;
      /* font-size: 12px; */
    }
    .back-link:hover { color: #333; }

    .meta { border-top: 1px solid #ccc; }

    .meta-row {
      display: flex;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }

    .meta-label {
      color: #888;
      min-width: 72px;
      flex-shrink: 0;
    }

    .meta-value { color: #222; }

    .meta-value.tags span { color: #4a6fa5; }
    .meta-value.tags span::after { content: '; '; color: #222; }
    .meta-value.tags span:last-child::after { content: ''; }

    .attachments-label {
      margin-top: 16px;
      margin-bottom: 6px;
      /* font-weight: bold; */
      color: #333;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 3px;
    }

    .grid-item {
      aspect-ratio: 1;
      overflow: hidden;
      cursor: pointer;
    }

    /* Cycling urban-palette placeholders */
    .grid-item:nth-child(6n+1) { background: linear-gradient(135deg, rgba(176,184,200,0.35) 0%, rgba(120,136,152,0.35) 100%); } /* slate stone */
    .grid-item:nth-child(6n+2) { background: linear-gradient(135deg, rgba(212,196,164,0.35) 0%, rgba(160,140,108,0.35) 100%); } /* warm sandstone */
    .grid-item:nth-child(6n+3) { background: linear-gradient(135deg, rgba(200,144,128,0.35) 0%, rgba(152,96,80,0.35) 100%); } /* brick terracotta */
    .grid-item:nth-child(6n+4) { background: linear-gradient(135deg, rgba(136,152,188,0.35) 0%, rgba(88,104,136,0.35) 100%); } /* twilight steel */
    .grid-item:nth-child(6n+5) { background: linear-gradient(135deg, rgba(168,164,116,0.35) 0%, rgba(120,112,68,0.35) 100%); } /* aged bronze */
    .grid-item:nth-child(6n+6) { background: linear-gradient(135deg, rgba(188,204,216,0.35) 0%, rgba(136,152,176,0.35) 100%); } /* overcast sky */

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
      transform: translateZ(0);
    }

    .grid-item img.loaded {
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    .grid-item:hover img.loaded { opacity: 0.88; }

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #lightbox.open { display: flex; }

    #lb-img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      display: block;
      user-select: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #lb-img.loaded { opacity: 1; }

    #lb-spinner {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 3px solid #444;
      border-top-color: #aaa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    #lightbox.loading #lb-spinner { display: block; }
    #lightbox.loading #lb-img { opacity: 0; }

    @keyframes spin { to { transform: rotate(360deg); } }

    #lb-close {
      position: fixed;
      top: 16px;
      right: 22px;
      font-size: 26px;
      color: #999;
      cursor: pointer;
      line-height: 1;
      background: none;
      border: none;
      z-index: 1001;
    }
    #lb-close:hover { color: #fff; }

    #lb-prev, #lb-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 32px;
      color: #777;
      cursor: pointer;
      background: none;
      border: none;
      padding: 12px 18px;
      z-index: 1001;
      user-select: none;
    }
    #lb-prev { left: 6px; }
    #lb-next { right: 6px; }
    #lb-prev:hover, #lb-next:hover { color: #fff; }

    #lb-counter {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<div id="lightbox">
  <div id="lb-spinner"></div>
  <button id="lb-close">&#x2715;</button>
  <button id="lb-prev">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next">&#8250;</button>
  <div id="lb-counter"></div>
</div>

<script>
  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return
      const img = entry.target
      img.src = img.dataset.src
      img.addEventListener('load', () => img.classList.add('loaded'), { once: true })
      img.addEventListener('error', () => img.classList.add('loaded'), { once: true })
      obs.unobserve(img)
    })
  }, { rootMargin: '300px' })

  const items = Array.from(document.querySelectorAll('.grid-item img'))
  items.forEach(img => observer.observe(img))

  const lb = document.getElementById('lightbox')
  const lbImg = document.getElementById('lb-img')
  const lbCounter = document.getElementById('lb-counter')
  let current = 0

  function openLb(i) {
    current = i
    const url = items[i].dataset.src
    lbImg.classList.remove('loaded')
    lb.classList.add('open', 'loading')
    document.body.style.overflow = 'hidden'
    lbCounter.textContent = (i + 1) + ' / ' + items.length
    const tmp = new Image()
    tmp.onload = () => { lbImg.src = url; lbImg.classList.add('loaded'); lb.classList.remove('loading') }
    tmp.onerror = () => lb.classList.remove('loading')
    tmp.src = url
  }

  function closeLb() { lb.classList.remove('open', 'loading'); document.body.style.overflow = '' }
  function prevLb() { openLb((current - 1 + items.length) % items.length) }
  function nextLb() { openLb((current + 1) % items.length) }

  items.forEach((img, i) => img.parentElement.addEventListener('click', () => openLb(i)))
  document.getElementById('lb-close').addEventListener('click', closeLb)
  document.getElementById('lb-prev').addEventListener('click', prevLb)
  document.getElementById('lb-next').addEventListener('click', nextLb)
  lb.addEventListener('click', e => { if (e.target === lb) closeLb() })
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return
    if (e.key === 'Escape') closeLb()
    if (e.key === 'ArrowLeft') prevLb()
    if (e.key === 'ArrowRight') nextLb()
  })
</script>
